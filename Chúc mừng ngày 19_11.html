<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chúc mừng ngày 19/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Be+Vietnam+Pro:wght@300;400;600&family=La+Belle+Aurore&display=swap">
<style>
:root{--ink:#f4f1ff;--mut:#b9b4e8;--pur:#6b3df5;--blu:#2f6bff;--cy:#19b5ff;--pk:#ff6fcf;--hd:"Unbounded","Be Vietnam Pro","Segoe UI",Arial,sans-serif;--bd:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--bd);color:var(--ink);min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#03031a 0%,#08083a 40%,#14107a 80%,#1f1a9c 100%) fixed}
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:rgba(107,61,245,.55);top:-120px;left:-100px}
.b2{width:460px;height:460px;background:rgba(25,120,255,.45);bottom:-140px;right:-120px;animation-duration:18s}
.b3{width:300px;height:300px;background:rgba(255,111,207,.28);top:45%;left:50%;animation-duration:11s}
@keyframes drift{to{transform:translate(80px,-60px) scale(1.25)}}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.ticker{position:fixed;top:0;left:0;right:0;z-index:4;padding-top:env(safe-area-inset-top,0px);background:rgba(60,50,200,.35);border-bottom:1px solid rgba(120,160,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden;height:calc(38px + env(safe-area-inset-top,0px))}
.track{display:inline-flex;white-space:nowrap;line-height:38px;font-family:var(--hd);font-size:12px;font-weight:500;animation:mq 28s linear infinite}
.track span{padding:0 22px;color:#d9d3ff}
@keyframes mq{to{transform:translateX(-50%)}}
.page{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:calc(66px + env(safe-area-inset-top,0px)) 18px 50px;text-align:center}
h1{font-family:var(--hd);font-weight:800;margin:6px 0 0;white-space:nowrap;font-size:clamp(14px,4.4vw,40px);letter-spacing:-.01em;background:linear-gradient(90deg,#fff,#a9c4ff,#ff9be0,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.to{display:inline-block;margin:16px 0 4px;padding:8px 22px;border-radius:999px;border:1.5px solid var(--cy);background:rgba(25,181,255,.12);box-shadow:0 0 22px rgba(25,181,255,.35);font-size:15px;animation:float 3.2s ease-in-out infinite}
.to b{font-family:var(--hd);font-weight:700;color:#fff}
@keyframes float{50%{transform:translateY(-5px)}}
.sub{margin:10px 0 18px;font-weight:300;color:var(--mut);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{cursor:pointer;font:inherit;color:inherit;border:1.5px solid rgba(70,150,255,.6);border-radius:18px;padding:16px 8px;background:linear-gradient(160deg,rgba(120,70,255,.38),rgba(20,70,170,.38));box-shadow:0 0 0 rgba(0,0,0,0);transition:transform .25s,box-shadow .25s,background .25s;animation:in .7s both}
.tile:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 10px 28px rgba(60,120,255,.45)}
.tile .e{font-size:30px;display:block;animation:float 3s ease-in-out infinite}
.tile .l{font-family:var(--hd);font-weight:700;font-size:13px;display:block;margin-top:6px}
.tile .n{font-size:11px;color:var(--mut);display:block;margin-top:2px}
.tile.on{background:linear-gradient(160deg,#ff6fcf,#7a5cff 60%,#2f7bff);border-color:#fff;box-shadow:0 0 30px rgba(255,111,207,.6)}
.tile.on .n{color:#fff}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.stage{perspective:900px;margin-top:22px}
.card{position:relative;min-height:230px;padding:26px 22px 22px;border-radius:26px;border:2.5px solid transparent;background:linear-gradient(#0d0b3f,#17117a) padding-box,linear-gradient(135deg,#ff6fcf,#7a5cff,#19b5ff) border-box;box-shadow:0 0 40px rgba(122,92,255,.5);animation:glow 3s ease-in-out infinite;transition:transform .15s}
@keyframes glow{50%{box-shadow:0 0 70px rgba(255,111,207,.55)}}
.card.swap .txt{animation:in .6s both}
.tag{display:inline-block;font-family:var(--hd);font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:linear-gradient(135deg,var(--pur),var(--blu));margin-bottom:14px}
.card .hello{font-family:var(--hd);font-size:15px;font-weight:700;margin:0 0 10px}
.txt{font-size:17px;line-height:1.85;font-weight:300;margin:0;min-height:120px}
.ph{font-weight:300;color:var(--mut);font-size:16px;margin:30px 0}
.btns{display:none;margin-top:18px;gap:10px;justify-content:center;flex-wrap:wrap}
.card.has .btns{display:flex}.card.has .ph{display:none}.card:not(.has) .tag,.card:not(.has) .hello,.card:not(.has) .txt{display:none}
button.b{font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:#fff;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);padding:10px 18px;border-radius:999px;transition:transform .2s}
button.b:hover{transform:translateY(-2px)}
button.f{background:linear-gradient(135deg,var(--pur),var(--blu));border-color:transparent;box-shadow:0 6px 22px rgba(80,90,255,.55)}
.tools{margin-top:16px;display:flex;justify-content:center}
.hint{margin-top:22px;font-size:13px;font-weight:300;color:var(--mut)}
#start,#modal{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:rgba(3,3,26,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
#start h2{font-family:var(--hd);font-weight:800;font-size:clamp(18px,5vw,26px);margin:0}
#start p{margin:0;font-weight:300;color:var(--mut)}
#nm{font:inherit;font-size:18px;text-align:center;color:#fff;background:rgba(255,255,255,.1);border:1.5px solid rgba(120,160,255,.6);border-radius:999px;padding:13px 20px;width:min(310px,80vw);outline:none}
#nm:focus{border-color:var(--pk);box-shadow:0 0 22px rgba(255,111,207,.4)}
#nm::placeholder{color:rgba(255,255,255,.45)}
#modal{display:none;z-index:20}
#modal.show{display:flex}
#modal img{max-width:min(420px,88vw);max-height:68vh;border-radius:18px;box-shadow:0 0 50px rgba(122,92,255,.6)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#1c1780;border:1px solid var(--cy);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="cv"></canvas>

<div class="ticker"><div class="track" id="trk"></div></div>

<div id="start">
  <div style="font-size:54px">✨</div>
  <h2>Có một lời chúc dành cho bạn</h2>
  <p>Hãy nhập tên của bạn nhé</p>
  <input id="nm" type="text" maxlength="30" placeholder="Tên của bạn" autocomplete="off">
  <button class="b f" id="open">Mở thiệp 🎆</button>
</div>

<div class="page">
  <h1>Chúc mừng ngày 19/11</h1>
  <div class="to">✦ Gửi <b id="who">bạn</b> ✦</div>
  <p class="sub">Chọn một mục để nhận lời chúc dành riêng cho bạn</p>
  <div class="grid" id="grid"></div>

  <div class="stage"><div class="card" id="card">
    <p class="ph">Chạm vào một mục phía trên để nhận lời chúc 💫</p>
    <span class="tag" id="tag"></span>
    <p class="hello" id="hello"></p>
    <p class="txt" id="txt"></p>
    <div class="btns">
      <button class="b f" id="more">🔄 Lời chúc khác</button>
      <button class="b" id="save">📸 Lưu ảnh</button>
    </div>
  </div></div>

  <div class="tools"><button class="b" id="mute">🔊 Tắt nhạc</button></div>
  <div class="hint">Chạm vào bất kỳ đâu để bắn pháo hoa ✨</div>
</div>

<div id="modal">
  <img id="pic" alt="Thiệp chúc mừng">
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="b f" id="dl" style="display:none">⬇️ Tải ảnh về</button>
    <button class="b" id="close">Đóng</button>
  </div>
  <div class="hint" id="mhint" style="margin:0">Trên điện thoại, bạn có thể nhấn giữ vào ảnh để lưu</div>
</div>
<div id="toast"></div>

<script>
(function(){
  var CATS = [
    {e:"🕊️",t:"Bình an",w:[
      "Chúc bạn một đời bình an, mỗi ngày đều ngập tràn niềm vui, luôn gặp những điều dịu dàng và may mắn. Mong những điều tốt đẹp nhất sẽ luôn đến với bạn, công việc thuận lợi, mọi dự định đều suôn sẻ và những cố gắng của bạn đều được đền đáp xứng đáng.",
      "Chúc bạn có những ngày thật nhẹ nhàng, lòng luôn bình yên dù ngoài kia có bao nhiêu bộn bề. Mong bạn luôn được bao quanh bởi những người yêu thương và những điều ấm áp.",
      "Mong mọi lo toan của bạn sẽ hóa thành nhẹ nhõm, mọi mệt mỏi đều có chỗ nghỉ ngơi, và mỗi buổi sáng thức dậy bạn đều thấy lòng mình thật an yên.",
      "Chúc bạn luôn giữ được một góc bình yên trong tim, để dù cuộc sống có bận rộn đến đâu vẫn thấy lòng nhẹ tênh.",
      "Mong mỗi ngày trôi qua đều là một ngày dịu dàng với bạn, không vội vã, không muộn phiền.",
      "Chúc bạn ngủ thật ngon, thức dậy thật tươi và gặp thật nhiều điều êm đềm trong ngày.",
      "Mong những ồn ào ngoài kia không làm bạn chùn bước, và bạn luôn tìm thấy sự an nhiên trong chính mình.",
      "Chúc bạn bình an trên mọi chặng đường, đi xa hay ở gần đều có người thương nhớ và mong bạn trở về.",
      "Chúc bạn có thật nhiều khoảnh khắc yên tĩnh để lắng nghe trái tim mình và thấy mình thật đủ đầy.",
      "Mong cuộc sống sẽ luôn đối xử dịu dàng với bạn, như cách bạn đã đối xử tử tế với mọi người."]},
    {e:"💼",t:"Sự nghiệp",w:[
      "Chúc bạn công việc luôn thuận buồm xuôi gió, gặp được nhiều cơ hội tốt và những người đồng hành đáng quý. Mọi nỗ lực của bạn rồi sẽ nở hoa đúng lúc.",
      "Chúc bạn tự tin theo đuổi mọi dự định, vững vàng trước thử thách và luôn tiến thêm một bước gần hơn đến ước mơ của mình.",
      "Mong thời gian sắp tới mang đến cho bạn những thành công rực rỡ, những cột mốc đáng nhớ và niềm tự hào về chính mình.",
      "Chúc bạn luôn có những ý tưởng thật hay, những quyết định thật sáng suốt và những người đồng nghiệp thật đáng tin.",
      "Mong con đường sự nghiệp của bạn luôn rộng mở, mỗi bước đi đều vững vàng và đầy cảm hứng.",
      "Chúc bạn đạt được mọi mục tiêu đã đặt ra, và còn vượt xa hơn những gì bạn từng nghĩ.",
      "Chúc bạn gặp được những dự án thú vị, những người thầy đáng quý và những cơ hội xứng tầm với năng lực của mình.",
      "Mong sự chăm chỉ của bạn luôn được ghi nhận, và mỗi thành quả đều mang đến cho bạn thật nhiều niềm vui.",
      "Chúc bạn luôn học hỏi không ngừng, trưởng thành từng ngày và tỏa sáng theo cách riêng của mình.",
      "Chúc công việc của bạn thật suôn sẻ, tiền vào như nước và tinh thần luôn thoải mái.",
      "Mong mọi nỗ lực của bạn đều được đền đáp, mọi ước mơ đều có ngày thành hiện thực và mọi hành trình đều có những điều đáng nhớ.",
      "Chúc bạn vững vàng với những lựa chọn của mình, đủ bản lĩnh để vượt qua thử thách và đủ kiên trì để chạm đến những mục tiêu lớn.",
      "Chúc bạn luôn có đủ tự tin để thử sức với những điều mới, đủ can đảm để nắm bắt cơ hội và đủ sáng suốt để lựa chọn con đường phù hợp.",
      "Mong con đường sự nghiệp của bạn luôn rộng mở, công việc thuận buồm xuôi gió, những cố gắng đều được đền đáp bằng những thành tựu xứng đáng. Mong bạn gặp đúng cơ hội, đúng người đồng hành, luôn được trân trọng và ghi nhận. Chúc bạn ngày càng thành công, tài chính vững vàng, có đủ năng lực để theo đuổi những điều lớn lao và đủ tự do để tận hưởng thành quả mà mình đã nỗ lực tạo nên. ❤️"]},
    {e:"💪",t:"Sức khỏe",w:[
      "Chúc bạn luôn khỏe mạnh, tràn đầy năng lượng để làm những điều mình yêu thích. Hãy nhớ nghỉ ngơi và chăm sóc bản thân thật tốt nhé.",
      "Chúc bạn thân thể khỏe, tinh thần vững, giấc ngủ ngon và những buổi sáng thật tươi mới.",
      "Mong bạn luôn giữ được sự dẻo dai, bền bỉ và một tâm hồn thật trẻ trung, yêu đời.",
      "Chúc bạn có một cơ thể dẻo dai, một trái tim khỏe và một tinh thần luôn lạc quan.",
      "Mong bạn luôn ăn ngon, ngủ yên và có đủ sức để chạm tay vào mọi điều mình mơ ước.",
      "Chúc bạn mỗi ngày đều tràn đầy sinh lực, bước đi nhẹ nhàng và nụ cười luôn tươi tắn.",
      "Mong những mệt mỏi sẽ nhanh chóng tan biến, nhường chỗ cho sự khỏe khoắn và tràn đầy năng lượng.",
      "Chúc bạn luôn biết yêu thương bản thân, nghỉ ngơi đúng lúc và giữ gìn sức khỏe thật tốt.",
      "Chúc bạn vừa khỏe người, vừa khỏe lòng, để mọi điều tốt đẹp đều có thể đến với mình.",
      "Mong sức khỏe luôn là người bạn đồng hành vững chãi, cùng bạn đi qua mọi chặng đường dài."]},
    {e:"🍀",t:"May mắn",w:[
      "Chúc bạn luôn gặp may mắn trên mọi nẻo đường, quý nhân phù trợ, bước đến đâu cũng có điều tốt đẹp chờ sẵn.",
      "Chúc bạn mỗi ngày đều có một điều bất ngờ nho nhỏ thật dễ thương, và những cánh cửa mới luôn rộng mở.",
      "Mong vận may luôn mỉm cười với bạn, để mọi điều bạn mong ước đều đến đúng lúc, đúng nơi.",
      "Chúc bạn luôn đi đúng đường, gặp đúng người và làm đúng việc vào đúng thời điểm.",
      "Mong may mắn đến gõ cửa bạn mỗi ngày, mang theo thật nhiều niềm vui và những tin tốt lành.",
      "Chúc bạn có đôi mắt biết nhìn thấy cơ hội, đôi tay biết nắm lấy và một trái tim đủ can đảm để bước tiếp.",
      "Mong mọi khó khăn trên đường của bạn đều có người giúp, mọi ngã rẽ đều dẫn đến điều tốt đẹp.",
      "Chúc bạn như được trời thương, làm gì cũng thuận, nghĩ gì cũng thành.",
      "Chúc bạn luôn được quý nhân phù trợ, bình an và may mắn ở bất cứ nơi đâu.",
      "Mong những điều ngẫu nhiên trong đời bạn đều là những điều dễ thương và đáng nhớ."]},
    {e:"💖",t:"Hạnh phúc",w:[
      "Chúc bạn có một gia đình ấm áp, những người bạn chân thành và thật nhiều tiếng cười mỗi ngày.",
      "Chúc bạn luôn được yêu thương đúng cách, biết trân trọng những điều giản dị và tìm thấy hạnh phúc trong từng khoảnh khắc nhỏ bé.",
      "Mong trái tim bạn luôn ấm áp, nụ cười luôn rạng rỡ và cuộc sống luôn đủ đầy niềm vui.",
      "Chúc bạn có thật nhiều bữa cơm ấm cúng, thật nhiều cái ôm chặt và thật nhiều lần cười đến đau bụng.",
      "Mong bạn luôn có người để sẻ chia, có chỗ để trở về và có lý do để mỉm cười mỗi ngày.",
      "Chúc bạn luôn được bao quanh bởi những người thương yêu bạn thật lòng.",
      "Mong cuộc sống của bạn luôn rực rỡ sắc màu, ngập tràn tiếng cười và đong đầy yêu thương.",
      "Chúc bạn hạnh phúc theo cách mà bạn mong muốn, bình yên mà vẫn ngập tràn niềm vui.",
      "Mong mỗi buổi tối trở về, bạn đều thấy lòng mình ấm áp và biết ơn vì một ngày đã qua.",

    x.font = "600 30px \"Be Vietnam Pro\", sans-serif"; x.fillStyle = "#ffb8ea"; x.fillText(CATS[cat].e + " " + CATS[cat].t, w/2, y0 + 70);
    x.font = "300 " + sz + "px \"Be Vietnam Pro\", sans-serif"; x.fillStyle = "#f4f1ff";
    lines.forEach(function(l, i){ x.fillText(l, w/2, y0 + 140 + i*lh); });
    x.font = "64px \"La Belle Aurore\", cursive"; var dg = x.createLinearGradient(300, 0, 780, 0); dg.addColorStop(0, "#ffd98a"); dg.addColorStop(1, "#ff9be0");
    x.fillStyle = dg; x.shadowColor = "rgba(255,200,120,.6)"; x.shadowBlur = 24; x.fillText("Best wishes for u,XH", w/2, 1290); x.shadowBlur = 0;
    return cc;
  }
  $("save").addEventListener("click", async function(){
    if(cat < 0) return; var b = this; b.disabled = true;
    try{
      lastCanvas = await makeImage(); $("pic").src = lastCanvas.toDataURL("image/png");
      $("dl").style.display = dlCap ? "" : "none"; $("modal").classList.add("show");
    }catch(e){ toast("Chưa tạo được ảnh, bạn thử lại nhé"); }
    b.disabled = false;
  });
  $("close").addEventListener("click", function(){ $("modal").classList.remove("show"); });
  $("dl").addEventListener("click", function(){
    if(!dlCap || !lastCanvas) return;
    lastCanvas.toBlob(function(blob){
      dlCap.save({filename:"loi-chuc-19-11.png", data:blob}).then(function(){ toast("Đã lưu ảnh ✨"); }).catch(function(e){
        if(e && e.code !== "declined") toast("Chưa lưu được, hãy nhấn giữ vào ảnh để lưu");
      });
    }, "image/png");
  });
})();
</script>
